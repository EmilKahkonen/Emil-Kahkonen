
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f8f8f6;
      --text: #171717;
      --muted: #777;
      --line: #deded9;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    header {
      padding: 28px 5vw 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .site-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    header a {
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
    }

    .intro {
      padding: 7vw 5vw 5vw;
      max-width: 1000px;
    }

    .intro h1 {
      margin: 0 0 20px;
      font-size: clamp(42px, 8vw, 100px);
      line-height: 0.95;
      font-weight: 400;
      letter-spacing: -0.06em;
    }

    .intro p {
      max-width: 540px;
      font-size: 16px;
      line-height: 1.65;
      color: #555;
    }

    .project-grid {
      padding: 0 5vw 8vw;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 48px 22px;
    }

    .project-card {
      cursor: pointer;
      min-width: 0;
    }

    .cover-wrap {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #e9e9e5;
      position: relative;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .project-card:hover .cover-wrap > img {
      transform: scale(1.025);
    }

    .project-meta {
      padding-top: 13px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
    }

    .project-title {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
    }

    .project-category {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }

    .project-page {
      display: none;
      padding: 28px 5vw 8vw;
    }

    .back-button {
      border: 0;
      padding: 0;
      margin: 0 0 35px;
      background: none;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }

    .project-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 20px;
    }

    .project-heading h1 {
      font-size: clamp(34px, 6vw, 72px);
      line-height: 1;
      letter-spacing: -0.05em;
      font-weight: 400;
      margin: 0;
    }

    .project-heading p {
      max-width: 360px;
      font-size: 13px;
      line-height: 1.6;
      color: #555;
      margin: 0;
    }

    .page-count {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 15px;
    }

    .pages-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .page-thumb {
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
      background: #e9e9e5;
      cursor: pointer;
    }

    .page-thumb > img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Jaettavan sivun neljänneksien esikatselu */

    .quadrant-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .quadrant {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.75);
      transition: background 0.2s ease;
    }

    .quadrant::after {
      content: "+";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 28px;
      font-weight: 300;
      opacity: 0;
      transition: opacity 0.2s ease;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    .quadrant-grid:hover .quadrant:not(:hover) {
      background: rgba(90, 90, 90, 0.48);
    }

    .quadrant-grid:hover .quadrant:not(:hover)::after {
      opacity: 0;
    }

    .quadrant:hover::after {
      opacity: 1;
    }

    .quadrant:hover {
      background: transparent;
    }

    .page-label {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 5px 8px;
      font-size: 11px;
      pointer-events: none;
    }

    /* Suurennettu katselu */

    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(248, 248, 246, 0.97);
      padding: 22px;
      align-items: center;
      justify-content: center;
    }

    .viewer.open {
      display: flex;
    }

    .viewer-inner {
      width: min(100%, 1100px);
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .viewer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 15px;
    }

    .viewer-title {
      font-size: 13px;
      color: #555;
    }

    .viewer-close {
      border: 1px solid var(--line);
      background: transparent;
      padding: 9px 13px;
      cursor: pointer;
    }

    .viewer-content {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .large-slide-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .large-slide-frame img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .large-slide-frame.zoomed {
      width: min(100%, calc(100vh - 130px));
      height: min(100%, calc(100vh - 130px));
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .large-slide-frame.zoomed img {
      position: absolute;
      width: 200%;
      height: 200%;
      max-width: none;
      max-height: none;
      object-fit: fill;
    }

    .large-slide-frame.q-tl img {
      left: 0;
      top: 0;
    }

    .large-slide-frame.q-tr img {
      left: -100%;
      top: 0;
    }

    .large-slide-frame.q-bl img {
      left: 0;
      top: -100%;
    }

    .large-slide-frame.q-br img {
      left: -100%;
      top: -100%;
    }

    .viewer-bottom {
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      font-size: 12px;
      color: #555;
    }

    .viewer-controls {
      display: flex;
      gap: 8px;
    }

    .viewer-controls button {
      border: 1px solid var(--line);
      background: transparent;
      padding: 9px 13px;
      cursor: pointer;
    }

    .viewer-controls button:hover,
    .viewer-close:hover {
      background: #e9e9e5;
    }

    .empty-message {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 13px;
      padding: 30px 0;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 25px 5vw;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 650px) {
      header {
        padding: 22px 5vw;
      }

      .intro {
        padding-top: 60px;
      }

      .project-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .pages-grid {
        grid-template-columns: 1fr;
      }

      .project-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .viewer {
        padding: 12px;
      }

      .viewer-controls button {
        padding: 8px 10px;
      }

      footer {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="site-name">PORTFOLIO</div>
    <a href="mailto:your.email@example.com">CONTACT</a>
  </header>

  <main>
    <section class="intro" id="homeIntro">
      <h1>Selected<br>Works</h1>
      <p>
        A selection of architectural projects, explorations and visual studies.
      </p>
    </section>

    <section class="project-grid" id="projectGrid"></section>

    <section class="project-page" id="projectPage">
      <button class="back-button" id="backButton">← All projects</button>

      <div class="project-heading">
        <h1 id="projectTitle"></h1>
        <p id="projectDescription"></p>
      </div>

      <div class="page-count" id="pageCount"></div>
      <div class="pages-grid" id="pagesGrid"></div>
    </section>
  </main>

  <footer>
    <span>Selected Works</span>
    <span>Architecture · Design · Visual Research</span>
  </footer>

  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer-inner">
      <div class="viewer-top">
        <div class="viewer-title" id="viewerTitle"></div>
        <button class="viewer-close" id="closeViewer">Close ✕</button>
      </div>

      <div class="viewer-content" id="viewerContent">
        <div class="large-slide-frame" id="largeSlideFrame">
          <img id="largeSlide" alt="">
        </div>
      </div>

      <div class="viewer-bottom">
        <span id="viewerCounter"></span>
        <div class="viewer-controls">
          <button id="previousSlide" aria-label="Previous slide">←</button>
          <button id="nextSlide" aria-label="Next slide">→</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const projects = [
      {
        title: "01 - Chapel",
        category: "Architecture",
        description: "A chapel project exploring space, light and materiality.",
        prefix: "01 - Chapel",
        cover: "covers/01 - Chapel.jpg",
        splitPages: [2, 3, 4, 5]
      },
      {
        title: "02 - Map",
        category: "Mapping",
        description: "A mapping project and spatial investigation.",
        prefix: "02 - Map",
        cover: "covers/02 - Map.jpg",
        splitPages: []
      },
      {
        title: "03 - Lapinlahti",
        category: "Architecture",
        description: "A project exploring place, history and reuse.",
        prefix: "03 - Lapinlahti",
        cover: "covers/03 - Lapinlahti.jpg",
        splitPages: []
      },
      {
        title: "04 - Cultural Centre",
        category: "Architecture",
        description: "A cultural centre project.",
        prefix: "04 - Cultural Centre",
        cover: "covers/04 - Cultural Centre.jpg",
        splitPages: []
      },
      {
        title: "05 - Apartment Building",
        category: "Housing",
        description: "An apartment building project.",
        prefix: "05 - Apartment Building",
        cover: "covers/05 - Apartment Building.jpg",
        splitPages: []
      }
    ];

    const projectGrid = document.getElementById("projectGrid");
    const homeIntro = document.getElementById("homeIntro");
    const projectPage = document.getElementById("projectPage");
    const projectTitle = document.getElementById("projectTitle");
    const projectDescription = document.getElementById("projectDescription");
    const pageCount = document.getElementById("pageCount");
    const pagesGrid = document.getElementById("pagesGrid");

    const viewer = document.getElementById("viewer");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerCounter = document.getElementById("viewerCounter");
    const largeSlideFrame = document.getElementById("largeSlideFrame");
    const largeSlide = document.getElementById("largeSlide");

    let activeProject = null;
    let activePages = [];
    let activeSequence = [];
    let activeIndex = 0;

    const quadrantNames = ["q-tl", "q-tr", "q-bl", "q-br"];
    const quadrantLabels = [
      "Top left",
      "Top right",
      "Bottom left",
      "Bottom right"
    ];

    function renderProjects() {
      projectGrid.innerHTML = "";

      projects.forEach((project) => {
        const card = document.createElement("article");
        card.className = "project-card";

        const coverWrap = document.createElement("div");
        coverWrap.className = "cover-wrap";

        const image = document.createElement("img");
        image.src = project.cover;
        image.alt = project.title;
        image.loading = "lazy";

        image.onerror = () => {
          image.style.display = "none";
          coverWrap.style.background = "#e9e9e5";
        };

        coverWrap.appendChild(image);

        const meta = document.createElement("div");
        meta.className = "project-meta";

        const title = document.createElement("h2");
        title.className = "project-title";
        title.textContent = project.title;

        const category = document.createElement("span");
        category.className = "project-category";
        category.textContent = project.category;

        meta.append(title, category);
        card.append(coverWrap, meta);

        card.addEventListener("click", () => openProject(project));

        projectGrid.appendChild(card);
      });
    }

    async function discoverPages(project) {
      const pages = [];
      let number = 1;

      while (number <= 300) {
        const path = `pages/${project.prefix}_${number}.jpg`;
        const exists = await imageExists(path);

        if (!exists) {
          break;
        }

        pages.push({
          number,
          src: path,
          split: project.splitPages.includes(number)
        });

        number++;
      }

      return pages;
    }

    function imageExists(src) {
      return new Promise((resolve) => {
        const image = new Image();

        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);
        image.src = src;
      });
    }

    async function openProject(project) {
      activeProject = project;
      homeIntro.style.display = "none";
      projectGrid.style.display = "none";
      projectPage.style.display = "block";

      projectTitle.textContent = project.title;
      projectDescription.textContent = project.description;
      pagesGrid.innerHTML = '<div class="empty-message">Loading pages…</div>';

      window.scrollTo({ top: 0, behavior: "instant" });

      activePages = await discoverPages(project);

      renderProjectPages();
    }

    function renderProjectPages() {
      pagesGrid.innerHTML = "";

      if (activePages.length === 0) {
        pagesGrid.innerHTML = `
          <div class="empty-message">
            No pages found. Check the filenames in the pages folder.
          </div>`;
        pageCount.textContent = "0 pages";
        return;
      }

      pageCount.textContent =
        `${activePages.length} page${activePages.length === 1 ? "" : "s"}`;

      activePages.forEach((page) => {
        const thumb = document.createElement("div");
        thumb.className = "page-thumb";

        const image = document.createElement("img");
        image.src = page.src;
        image.alt = `${activeProject.title}, page ${page.number}`;
        image.loading = "lazy";

        thumb.appendChild(image);

        if (page.split) {
          const quadrantGrid = document.createElement("div");
          quadrantGrid.className = "quadrant-grid";

          quadrantNames.forEach((quadrant, index) => {
            const cell = document.createElement("div");
            cell.className = "quadrant";
            cell.title = quadrantLabels[index];

            cell.addEventListener("click", (event) => {
              event.stopPropagation();

              const sequence = buildSequence(activeProject, activePages);
              const targetIndex = sequence.findIndex((item) =>
                item.pageNumber === page.number &&
                item.quadrant === quadrant
              );

              openViewer(sequence, targetIndex);
            });

            quadrantGrid.appendChild(cell);
          });

          thumb.appendChild(quadrantGrid);
        }

        const label = document.createElement("span");
        label.className = "page-label";
        label.textContent = `Page ${page.number}`;
        thumb.appendChild(label);

        thumb.addEventListener("click", () => {
          const sequence = buildSequence(activeProject, activePages);
          const targetIndex = sequence.findIndex((item) =>
            item.pageNumber === page.number &&
            !item.quadrant
          );

          if (targetIndex !== -1) {
            openViewer(sequence, targetIndex);
          } else {
            const firstQuadrantIndex = sequence.findIndex((item) =>
              item.pageNumber === page.number
            );

            openViewer(sequence, firstQuadrantIndex);
          }
        });

        pagesGrid.appendChild(thumb);
      });
    }

    function buildSequence(project, pages) {
      const sequence = [];

      pages.forEach((page) => {
        if (page.split) {
          quadrantNames.forEach((quadrant, index) => {
            sequence.push({
              src: page.src,
              pageNumber: page.number,
              quadrant,
              quadrantLabel: quadrantLabels[index],
              projectTitle: project.title
            });
          });
        } else {
          sequence.push({
            src: page.src,
            pageNumber: page.number,
            quadrant: null,
            quadrantLabel: null,
            projectTitle: project.title
          });
        }
      });

      return sequence;
    }

    function openViewer(sequence, index) {
      if (!sequence.length || index < 0) {
        return;
      }

      activeSequence = sequence;
      activeIndex = index;

      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      showSlide();
    }

    function showSlide() {
      if (!activeSequence.length) {
        return;
      }

      const item = activeSequence[activeIndex];

      largeSlide.src = item.src;
      largeSlide.alt = `${item.projectTitle}, page ${item.pageNumber}`;

      largeSlideFrame.className = "large-slide-frame";

      if (item.quadrant) {
        largeSlideFrame.classList.add("zoomed", item.quadrant);
      }

      viewerTitle.textContent = item.quadrant
        ? `${item.projectTitle} · Page ${item.pageNumber} · ${item.quadrantLabel}`
        : `${item.projectTitle} · Page ${item.pageNumber}`;

      viewerCounter.textContent =
        `${activeIndex + 1} / ${activeSequence.length}`;
    }

    function nextSlide() {
      if (!activeSequence.length) return;

      activeIndex = (activeIndex + 1) % activeSequence.length;
      showSlide();
    }

    function previousSlide() {
      if (!activeSequence.length) return;

      activeIndex =
        (activeIndex - 1 + activeSequence.length) %
        activeSequence.length;

      showSlide();
    }

    function closeViewer() {
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function closeProject() {
      projectPage.style.display = "none";
      projectGrid.style.display = "grid";
      homeIntro.style.display = "block";
      activeProject = null;

      window.scrollTo({ top: 0, behavior: "instant" });
    }

    document.getElementById("backButton").addEventListener("click", closeProject);
    document.getElementById("closeViewer").addEventListener("click", closeViewer);
    document.getElementById("nextSlide").addEventListener("click", nextSlide);
    document.getElementById("previousSlide").addEventListener("click", previousSlide);

    viewer.addEventListener("click", (event) => {
      if (event.target === viewer || event.target.id === "viewerContent") {
        closeViewer();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (!viewer.classList.contains("open")) return;

      if (event.key === "ArrowRight") nextSlide();
      if (event.key === "ArrowLeft") previousSlide();
      if (event.key === "Escape") closeViewer();
    });

    let wheelLocked = false;

    viewer.addEventListener("wheel", (event) => {
      if (!viewer.classList.contains("open") || wheelLocked) return;

      event.preventDefault();
      wheelLocked = true;

      if (event.deltaY > 0 || event.deltaX > 0) {
        nextSlide();
      } else if (event.deltaY < 0 || event.deltaX < 0) {
        previousSlide();
      }

      setTimeout(() => {
        wheelLocked = false;
      }, 450);
    }, { passive: false });

    renderProjects();
  </script>
</body>
</html>
