
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil Kähkönen — Portfolio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f8f8f6;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 35px 5%;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header a {
  color: inherit;
  text-decoration: none;
}

.name {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: .04em;
}

header span {
  color: #777;
  font-size: 13px;
}

main {
  max-width: 1500px;
  padding: 70px 5%;
  margin: auto;
}

h1 {
  font-size: clamp(42px, 7vw, 90px);
  letter-spacing: -.06em;
  font-weight: 500;
  margin: 0 0 15px;
}

.intro {
  color: #666;
  margin-bottom: 65px;
  line-height: 1.7;
}

/* PROJECT COVER GRID */

#projects {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 40px 25px;
}

.project {
  cursor: pointer;
  min-width: 0;
}

.cover {
  aspect-ratio: 1 / 1;
  background: #eee;
  overflow: hidden;
}

.cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .2s ease;
}

.project:hover .cover img {
  opacity: .85;
}

.project h2 {
  font-size: 19px;
  font-weight: 500;
  margin: 17px 0 5px;
}

.project p {
  color: #777;
  font-size: 13px;
  margin: 0;
}

/* PROJECT GALLERY */

#galleryView {
  display: none;
}

.back {
  background: none;
  border: 0;
  padding: 0;
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 40px;
}

#galleryTitle {
  margin-bottom: 20px;
}

/* SQUARE JPG THUMBNAILS */

#slides {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 25px 15px;
}

.slide {
  cursor: pointer;
  min-width: 0;
}

.slide-preview {
  aspect-ratio: 1 / 1;
  width: 100%;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.slide-preview img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.slide p {
  font-size: 12px;
  color: #777;
  margin-top: 10px;
}

/* FOOTER */

footer {
  padding: 30px 5%;
  border-top: 1px solid #ddd;
  font-size: 12px;
  color: #777;
}

/* LARGE IMAGE VIEWER */

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(15, 15, 15, .97);
  color: white;
  align-items: center;
  justify-content: center;
}

#viewer.open {
  display: flex;
}

#largeSlide {
  display: block;
  max-width: 84vw;
  max-height: 82vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

.viewerTop {
  position: absolute;
  top: 20px;
  left: 25px;
  right: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.viewerTop button,
.arrow {
  color: white;
  background: transparent;
  border: 0;
  cursor: pointer;
  font-size: 28px;
  padding: 10px;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
}

#prev {
  left: 12px;
}

#next {
  right: 12px;
}

#counter {
  position: absolute;
  bottom: 18px;
  font-size: 13px;
  color: #ccc;
}

/* RESPONSIVE LAYOUT */

@media (min-width: 651px) and (max-width: 1000px) {
  #slides {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {
  header {
    padding: 23px 5%;
  }

  header span {
    display: none;
  }

  main {
    padding-top: 45px;
  }

  #projects {
    grid-template-columns: 1fr;
    gap: 35px;
  }

  #slides {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px 10px;
  }

  #largeSlide {
    max-width: 100vw;
    max-height: 75vh;
  }

  .arrow {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <a class="name" href="#" id="homeLink">Emil Kähkönen</a>
  <span>SELECTED WORK · PORTFOLIO</span>
</header>

<main>

  <!-- FRONT PAGE -->

  <section id="homeView">
    <h1>Selected work.</h1>

    <p class="intro">
      A selection of my projects.<br>
      Explore each project below.
    </p>

    <div id="projects"></div>
  </section>

  <!-- PROJECT GALLERY -->

  <section id="galleryView">
    <button class="back" id="backButton">← All projects</button>

    <h1 id="galleryTitle"></h1>

    <p class="intro" id="galleryDescription"></p>

    <div id="slides"></div>
  </section>

</main>

<footer>© 2026 Emil Kähkönen</footer>

<!-- FULL-SCREEN IMAGE VIEWER -->

<div id="viewer" role="dialog" aria-modal="true"
     aria-label="Image viewer">

  <div class="viewerTop">
    <span id="viewerTitle"></span>
    <button id="closeButton" aria-label="Close">✕</button>
  </div>

  <button class="arrow" id="prev" aria-label="Previous page">←</button>

  <img id="largeSlide" src="" alt="Project page">

  <button class="arrow" id="next" aria-label="Next page">→</button>

  <div id="counter"></div>
</div>

<script>

/*
==================================================
PROJECT SETTINGS
==================================================

Project pages are JPG images in the "pages" folder.

Example:
pages/01 - Chapel_1.jpg
pages/01 - Chapel_2.jpg
pages/01 - Chapel_3.jpg

The code automatically looks for numbered pages
and stops when the next JPG file is not found.
*/

const projects = [
  {
    title: "01 - Chapel",
    category: "EPFL · 2025",
    description: "Bio-Sourced Self-Bearing Watertight Building Envelopes, St. Loup Chapel.",
    prefix: "01 - Chapel",
    cover: "covers/01 - Chapel.jpg"
  },
  {
    title: "02 - Map",
    category: "EPFL · 2025",
    description: "The development of Zürich.",
    prefix: "02 - Map",
    cover: "covers/02 - Map.jpg"
  },
  {
    title: "03 - Lapinlahti",
    category: "Aalto · 2026",
    description: "A Reuse Plan for Lapinlahti Hospital.",
    prefix: "03 - Lapinlahti",
    cover: "covers/03 - Lapinlahti.jpg"
  },
  {
    title: "04 - Cultural Centre",
    category: "Aalto · 2025",
    description: "A Solid Brick Structure for Culture in Taka-Töölö.",
    prefix: "04 - Cultural Centre",
    cover: "covers/04 - Cultural Centre.jpg"
  },
  {
    title: "05 - Apartment Building",
    category: "Aalto · 2025",
    description: "A Residential Building Shaped by a Rhythm of Columns in Myllypuro.",
    prefix: "05 - Apartment Building",
    cover: "covers/05 - Apartment Building.jpg"
  }
];

/* STATE */

let currentProject = null;
let currentPage = 1;
let projectPages = {};
let viewerToken = 0;

/* IMAGE PATH */

function pagePath(project, pageNumber) {
  return "pages/" + project.prefix + "_" + pageNumber + ".jpg";
}

/* CHECK WHETHER AN IMAGE EXISTS */

function imageExists(src) {
  return new Promise((resolve) => {
    const image = new Image();

    image.onload = () => resolve(true);
    image.onerror = () => resolve(false);

    image.src = src;
  });
}

/* FIND ALL NUMBERED PAGES FOR A PROJECT */

async function findProjectPages(project) {
  if (projectPages[project.prefix]) {
    return projectPages[project.prefix];
  }

  const pages = [];
  let pageNumber = 1;
  const maxPages = 500;

  while (pageNumber <= maxPages) {
    const src = pagePath(project, pageNumber);
    const exists = await imageExists(src);

    if (!exists) {
      break;
    }

    pages.push(src);
    pageNumber++;
  }

  projectPages[project.prefix] = pages;

  return pages;
}

/* CREATE FRONT-PAGE PROJECT CARDS */

function init() {
  const container = document.getElementById("projects");

  projects.forEach((project, index) => {
    const card = document.createElement("article");
    card.className = "project";

    card.innerHTML = `
      <div class="cover">
        <img
          src="${project.cover}"
          alt="${project.title} cover"
          loading="lazy"
        >
      </div>

      <h2>${project.title}</h2>
      <p>${project.category}</p>
    `;

    card.addEventListener("click", () => openProject(index));

    container.appendChild(card);
  });
}

/* OPEN A PROJECT */

async function openProject(index) {
  currentProject = index;

  document.getElementById("homeView").style.display = "none";
  document.getElementById("galleryView").style.display = "block";

  document.getElementById("galleryTitle").textContent =
    projects[index].title;

  document.getElementById("galleryDescription").textContent =
    projects[index].description;

  const slides = document.getElementById("slides");
  slides.innerHTML = "<p>Loading project pages…</p>";

  window.scrollTo(0, 0);

  const pages = await findProjectPages(projects[index]);

  /* Ignore the result if another project was opened meanwhile. */
  if (currentProject !== index) return;

  slides.innerHTML = "";

  if (pages.length === 0) {
    slides.innerHTML = `
      <p>
        No JPG pages found. Check the folder and filenames.
      </p>
    `;
    return;
  }

  pages.forEach((src, pageIndex) => {
    const pageNumber = pageIndex + 1;
    const card = document.createElement("div");

    card.className = "slide";

    card.innerHTML = `
      <div class="slide-preview">
        <img
          src="${src}"
          alt="${projects[index].title}, page ${pageNumber}"
          loading="lazy"
        >
      </div>

      <p>PAGE ${String(pageNumber).padStart(2, "0")}</p>
    `;

    card.addEventListener("click", () => showSlide(pageNumber));

    slides.appendChild(card);
  });
}

/* SHOW A LARGE PAGE */

async function showSlide(pageNumber) {
  if (currentProject === null) return;

  const pages = await findProjectPages(projects[currentProject]);

  if (pageNumber < 1 || pageNumber > pages.length) return;

  currentPage = pageNumber;
  const token = ++viewerToken;

  const project = projects[currentProject];
  const image = document.getElementById("largeSlide");

  document.getElementById("viewer").classList.add("open");
  document.getElementById("viewerTitle").textContent = project.title;

  document.getElementById("counter").textContent =
    `${currentPage} / ${pages.length}`;

  image.style.visibility = "hidden";
  image.src = pages[pageNumber - 1];

  image.onload = () => {
    if (token !== viewerToken) return;
    image.style.visibility = "visible";
  };

  image.onerror = () => {
    if (token !== viewerToken) return;
    image.style.visibility = "visible";
  };
}

/* NEXT OR PREVIOUS PAGE */

async function changeSlide(direction) {
  if (currentProject === null) return;

  const pages = await findProjectPages(projects[currentProject]);
  const nextPage = currentPage + direction;

  if (nextPage >= 1 && nextPage <= pages.length) {
    showSlide(nextPage);
  }
}

/* CLOSE VIEWER */

function closeViewer() {
  document.getElementById("viewer").classList.remove("open");
  viewerToken++;
}

/* RETURN TO FRONT PAGE */

function goHome() {
  closeViewer();

  document.getElementById("galleryView").style.display = "none";
  document.getElementById("homeView").style.display = "block";

  currentProject = null;

  window.scrollTo(0, 0);
}

/* BUTTONS */

document.getElementById("prev").onclick = () => changeSlide(-1);
document.getElementById("next").onclick = () => changeSlide(1);
document.getElementById("closeButton").onclick = closeViewer;
document.getElementById("backButton").onclick = goHome;

document.getElementById("homeLink").onclick = (event) => {
  event.preventDefault();
  goHome();
};

/* CLICK OUTSIDE IMAGE TO CLOSE */

document.getElementById("viewer").addEventListener("click", (event) => {
  if (event.target.id === "viewer") {
    closeViewer();
  }
});

/* KEYBOARD CONTROLS */

document.addEventListener("keydown", (event) => {
  if (!document.getElementById("viewer").classList.contains("open")) {
    return;
  }

  if (event.key === "ArrowRight") changeSlide(1);
  if (event.key === "ArrowLeft") changeSlide(-1);
  if (event.key === "Escape") closeViewer();
});

/* MOUSE WHEEL CONTROLS */

let wheelLocked = false;

document.getElementById("viewer").addEventListener("wheel", (event) => {
  if (!document.getElementById("viewer").classList.contains("open")) {
    return;
  }

  event.preventDefault();

  if (wheelLocked || Math.abs(event.deltaY) < 20) return;

  wheelLocked = true;

  changeSlide(event.deltaY > 0 ? 1 : -1);

  setTimeout(() => {
    wheelLocked = false;
  }, 250);

}, { passive: false });

/* START */

init();

</script>

</body>
</html>
